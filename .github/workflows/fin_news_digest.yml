name: Financial Headlines Digest

on:
  schedule:
    - cron: "0 0 * * *"   # 08:00 Asia/Shanghai
    - cron: "0 13 * * *"  # 08:00 America/New_York (EST); 09:00 during DST
  workflow_dispatch:
    inputs:
      edition:
        description: "Optional: NY or BJ. Leave empty to send both editions."
        required: false
        default: ""

concurrency:
  group: fin-news-digest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fin_news_digest/requirements.txt

      - name: Write .env from MAIL_FIN
        run: |
          printf "%s" "${{ secrets.MAIL_FIN }}" > .env

      - name: Run digest (manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          MAIL_FIN: ${{ secrets.MAIL_FIN }}
          MANUAL_EDITION: ${{ github.event.inputs.edition }}
        run: |
          if [ -n "${MANUAL_EDITION}" ]; then
            edition="$(echo "${MANUAL_EDITION}" | tr '[:lower:]' '[:upper:]')"
            if [ "${edition}" != "NY" ] && [ "${edition}" != "BJ" ]; then
              echo "Invalid manual edition: ${MANUAL_EDITION}. Use NY or BJ."
              exit 1
            fi
            echo "Manual run: single edition ${edition}"
            export SCHEDULED_RUN="true"
            export SCHEDULED_EDITION="${edition}"
            python -m fin_news_digest.run_actions
          else
            echo "Manual run: both editions"
            export FORCE_SEND="true"
            python -m fin_news_digest.run_actions
          fi

      - name: Run digest (schedule)
        if: ${{ github.event_name == 'schedule' }}
        env:
          MAIL_FIN: ${{ secrets.MAIL_FIN }}
          SCHEDULED_RUN: "true"
          SCHEDULED_EDITION: ${{ github.event.schedule == '0 0 * * *' && 'BJ' || 'NY' }}
        run: |
          python -m fin_news_digest.run_actions

      - name: Commit news feed JSON
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f news-feed.json news-feed.xml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update news feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: Trigger blog rebuild
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' }}
        run: |
          curl -s -X POST "$VERCEL_DEPLOY_HOOK" || true
