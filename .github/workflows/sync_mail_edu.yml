name: Sync MAIL_EDU Secret

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Build MAIL_EDU payload from MAIL_FIN
        env:
          MAIL_FIN: ${{ secrets.MAIL_FIN }}
        run: |
          set -euo pipefail

          pick() {
            local out=""
            for key in "$@"; do
              out="$(printf '%s\n' "${MAIL_FIN}" | awk -F= -v k="${key}" '$1==k{ $1=""; sub(/^=/,""); print; exit }')"
              if [ -n "${out}" ]; then
                printf '%s' "${out}"
                return 0
              fi
            done
            printf ''
          }

          smtp_host="$(pick SMTP_HOST FIN_SMTP_HOST)"
          smtp_port="$(pick SMTP_PORT FIN_SMTP_PORT)"
          smtp_user="$(pick SMTP_USER FIN_SMTP_USER)"
          smtp_pass="$(pick SMTP_PASS FIN_SMTP_PASS)"
          mail_from="$(pick MAIL_FROM SMTP_FROM FIN_SMTP_FROM)"
          recipients="$(pick RECIPIENTS FIN_RECIPIENTS)"
          openai_key="$(pick OPENAI_API_KEY FIN_OPENAI_API_KEY)"
          openai_model="$(pick OPENAI_MODEL FIN_OPENAI_MODEL)"
          openai_base_url="$(pick OPENAI_BASE_URL FIN_OPENAI_BASE_URL)"

          if [ -z "${smtp_port}" ]; then
            smtp_port="587"
          fi
          if [ -z "${mail_from}" ]; then
            mail_from="${smtp_user}"
          fi
          if [ -z "${openai_model}" ]; then
            openai_model="gpt-4o-mini"
          fi
          if [ -z "${openai_base_url}" ]; then
            openai_base_url="https://api.openai.com/v1"
          fi

          extra_recipient="james20141606@gmail.com"
          if [ -n "${recipients}" ]; then
            case ",${recipients}," in
              *",${extra_recipient},"*) ;;
              *) recipients="${recipients},${extra_recipient}" ;;
            esac
          else
            recipients="${extra_recipient}"
          fi

          cat > mail_edu.env <<EOF
          SMTP_HOST=${smtp_host}
          SMTP_PORT=${smtp_port}
          SMTP_USER=${smtp_user}
          SMTP_PASS=${smtp_pass}
          MAIL_FROM=${mail_from}
          SMTP_TLS=true
          RECIPIENTS=${recipients}

          OPENAI_API_KEY=${openai_key}
          OPENAI_MODEL=${openai_model}
          OPENAI_BASE_URL=${openai_base_url}
          OPENAI_RERANK=false
          OPENAI_CANDIDATES=50
          OPENAI_SUMMARY=true

          LOOKBACK_HOURS=36
          FALLBACK_LOOKBACK_HOURS=72
          MIN_ITEMS=6
          MAX_ITEMS=40
          STATE_TTL_HOURS=72

          SOCIAL_MEDIA_SECTION=true
          SOCIAL_MEDIA_SUMMARY=true
          INDUSTRY_INSIGHTS=true

          RSSHUB_BASE=https://rsshub.app
          RSSHUB_BASES=https://rsshub.rssforever.com
          EOF

      - name: Sync MAIL_EDU into ai_edu_tracker
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          set -euo pipefail
          gh secret set MAIL_EDU -R james20141606/ai_edu_tracker < mail_edu.env
          gh secret list -R james20141606/ai_edu_tracker | grep '^MAIL_EDU'
